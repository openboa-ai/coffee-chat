name: Coffee Chat quality

on:
  pull_request:

permissions: {}

concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Coffee Chat shell quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verify trusted pull request author
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR_ASSOCIATION:
            ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              test "$ACTOR" = "$PR_AUTHOR"
              test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
              ;;
            *)
              test "$ACTOR" = "dependabot[bot]"
              test "$PR_AUTHOR" = "dependabot[bot]"
              test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
              ;;
          esac
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install immutable Gitleaks
        run: .github/scripts/install-gitleaks.sh
      - name: Scan complete history, tree, and raw blobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          test ! -e .gitleaks.toml
          test ! -e .gitleaksignore
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --redact --no-banner .
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --redact --no-banner .
          blob_dir="$(mktemp -d)"
          if test -n "$BASE_SHA"; then
            object_range="$BASE_SHA..$HEAD_SHA"
          else
            object_range="$HEAD_SHA"
          fi
          git rev-list --objects "$object_range" |
            cut -d' ' -f1 |
            git cat-file --batch-check='%(objectname) %(objecttype)' |
            awk '$2 == "blob" { print $1 }' |
            while read -r object_id; do
              git cat-file blob "$object_id" > "$blob_dir/$object_id"
            done
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow \
            --redact --no-banner "$blob_dir"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Enforce repository policy before delegated scripts
        run: node .github/ci-policy.mjs
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Run shell tests
        run: npm test
      - name: Verify README explanatory images offline
        run: npm run readme:assets:verify
      - name: Build package
        run: npm run build
      - name: Run package smoke
        run: npm run package:smoke
      - name: Check repository policy
        run: npm run policy

  aggregate:
    name: Coffee Chat required
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Interpret required lane state
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
